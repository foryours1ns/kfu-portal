{% extends 'base.html' %}
{% load static %}

{% block title %}Регистрация — Между парами{% endblock %}

{% block content %}
<h1>Регистрация</h1>

<form method="post" class="form" novalidate>
    {% csrf_token %}
    {% include 'accounts/_form_fields.html' %}
    <button type="submit">Зарегистрироваться</button>
</form>

<p class="form-note">Уже есть аккаунт? <a href="{% url 'accounts:login' %}">Войти</a></p>
{% endblock %}

{% block scripts %}
<script src="{% static 'js/signup-form.js' %}"></script>
{% endblock %}
